// до отрисовки: свой фон сразу, а на светлом фоне — тёмные часы и батарейка в верхней строке айфона
try { const s = JSON.parse(localStorage.getItem("svobodnye-okna-v1") || "{}"); if (/^#[0-9a-f]{6}$/i.test(s.bg || "")) {
  const n = parseInt(s.bg.slice(1), 16), l = (.2126 * (n >> 16 & 255) + .7152 * (n >> 8 & 255) + .0722 * (n & 255)) / 255;
  document.documentElement.style.setProperty("--bg", s.bg); document.querySelector('meta[name="theme-color"]').content = s.bg;

<style>
/* Свободные окна — приложение для мастеров студии: отметить свободные дни месяца и выложить картинку в сторис.
   Всё хранится только на телефоне мастера (localStorage). Цвета фона и акцента — свои, меняются в настройках. */
:root {
  --bg: #0B0B0A; --ink: #EEEDE9; --ac: #F37021; --on-ac: #121211; --ac-txt: #FFB07A;
  --ink-2: rgba(238,237,233,.78); --muted: rgba(238,237,233,.62); --faint: rgba(238,237,233,.38);
  --card: rgba(238,237,233,.045); --tile: rgba(238,237,233,.07); --tile-hi: rgba(238,237,233,.12); --line: rgba(238,237,233,.10);
  --ac-soft: rgba(243,112,33,.14); --ac-grad: linear-gradient(180deg, #FF8A45, #F37021);
  --f: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(.2,.7,.1,1); --ease-drawer: cubic-bezier(.32,.72,0,1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); transition: background .3s; overscroll-behavior: none; }
/* фон — у html, не у body: иначе фон body перекрывает свечение в углу */
body { margin: 0; min-height: 100dvh; color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior-y: none; }
/* полоска под часами айфона: прокрученное не лезет под время и батарейку */
body::before { content: ""; position: fixed; z-index: 40; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); pointer-events: none; }
body::after { content: ""; position: fixed; z-index: -1; top: -30vw; right: -30vw; width: 90vw; height: 90vw; pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--ac) 16%, transparent), transparent); }
button, input { font: inherit; color: inherit; }
button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 28px); display: grid; gap: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 2px; }
.top h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; }
.top p { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }
.ic-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--tile); color: var(--ink-2); flex: none; transition: transform .15s var(--ease); }
.ic-btn:active { transform: scale(.92); }
.ic-btn:disabled { opacity: .3; cursor: default; }

.card { background: var(--card); border-radius: 26px; padding: 18px 16px; display: grid; gap: 14px; box-shadow: inset 0 0 0 1px var(--line); }
.month-sw { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month-sw b { font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
.month-sw b::first-letter { text-transform: uppercase; }
.month-sw .ic-btn { width: 40px; height: 40px; }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; touch-action: pan-y; }
.cal.slide-l { animation: slL .28s var(--ease); } .cal.slide-r { animation: slR .28s var(--ease); }
@keyframes slL { from { opacity: 0; transform: translateX(24px); } } @keyframes slR { from { opacity: 0; transform: translateX(-24px); } }
.cal .wd { font-size: 12px; color: var(--muted); text-align: center; padding-bottom: 2px; }
.cal button { aspect-ratio: 1; border: 0; border-radius: 14px; background: var(--tile); color: var(--ink); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums;
  transition: transform .15s var(--ease), background .2s; }
.cal button:active { transform: scale(.92); }
.cal button.free { background: var(--ac-grad); color: var(--on-ac); box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--ac) 80%, transparent), inset 0 1px 0 rgba(255,255,255,.3); }
.cal button.today { box-shadow: inset 0 0 0 2px var(--ink-2); }
.cal button.free.today { box-shadow: inset 0 0 0 2px var(--on-ac); }
.cal button:disabled { background: none; color: var(--faint); opacity: .6; cursor: default; }
.count-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; margin-top: -4px; }
.count { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; }
.count::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ac); flex: none; }
.count.empty::before { background: var(--faint); }
.link-btn { height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--tile); color: var(--ink); font-size: 14px; font-weight: 600; white-space: nowrap; transition: transform .15s var(--ease); }
.link-btn:active { transform: scale(.95); }

.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; color: var(--muted); }
.field input[type=text] { width: 100%; height: 48px; padding: 0 14px; border-radius: 14px; border: 0; background: var(--tile); font-size: 16px; box-shadow: inset 0 0 0 1px var(--line); -webkit-appearance: none; appearance: none; }
.field input::placeholder { color: var(--faint); }

.btn-main { height: 54px; border: 0; border-radius: 999px; background: var(--ac-grad); color: var(--on-ac); font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 10px 24px -12px color-mix(in srgb, var(--ac) 80%, transparent), inset 0 1px 0 rgba(255,255,255,.3); transition: transform .15s var(--ease); }
.btn-main:active { transform: scale(.97); }
.btn-main:disabled { background: var(--tile); color: var(--faint); box-shadow: none; cursor: default; transform: none; }
.hint { margin: -6px 0 0; font-size: 13px; color: var(--muted); text-align: center; text-wrap: balance; }

.prev-card h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink-2); }
.story-prev { width: 100%; max-width: 300px; aspect-ratio: 9 / 16; border-radius: 22px; display: block; margin: 0 auto; background: var(--bg); box-shadow: 0 22px 44px -28px rgba(0,0,0,.9), 0 0 0 1px var(--line); object-fit: cover; }

/* шторка настроек */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 51; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--sheet); border-radius: 28px 28px 0 0; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 20px); display: grid; gap: 16px;
  transform: translateY(105%); transition: transform .42s var(--ease-drawer); box-shadow: 0 -1px 0 var(--line); }
.sheet.on { transform: none; }
.sheet.drag { transition: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--tile-hi); margin: 0 auto 2px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet h2 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
/* «Готово» — наверху, как в шторках айфона: всегда видно, листать не нужно */
.done-btn { height: 40px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--ac-grad); color: var(--on-ac); font-weight: 600; font-size: 15px; flex: none; transition: transform .15s var(--ease); }
.done-btn:active { transform: scale(.95); }
.sheet .lead { margin: -10px 0 0; color: var(--muted); font-size: 13.5px; }
.sub-h { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: -6px; }
.themes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.themes button { aspect-ratio: 1; border-radius: 18px; border: 0; position: relative; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(128,128,128,.25); transition: transform .15s var(--ease); }
.themes button:active { transform: scale(.94); }
.themes button span { width: 42%; aspect-ratio: 1; border-radius: 50%; }
.themes button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--sheet), 0 0 0 4px var(--ink); }
.themes small { position: absolute; bottom: 5px; left: 0; right: 0; text-align: center; font-size: 10.5px; font-weight: 600; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pick label { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 12px; border-radius: 16px; background: var(--tile); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; font-size: 14px; }
.pick input[type=color] { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; flex: none; -webkit-appearance: none; appearance: none; }
.pick input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.pick input[type=color]::-webkit-color-swatch { border: 1px solid rgba(128,128,128,.4); border-radius: 50%; }
.pick input[type=color]::-moz-color-swatch { border: 1px solid rgba(128,128,128,.4); border-radius: 50%; }

.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 0 8px 0 18px; min-height: 44px; display: flex; align-items: center; gap: 4px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; transition: opacity .25s, transform .3s var(--ease); }
.toast:not(:has(button)) { padding-right: 18px; }
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (hover: hover) and (pointer: fine) { .link-btn:hover, .ic-btn:not(:disabled):hover { background: var(--tile-hi); } }
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<main class="app">
  <header class="top">
    <div><h1>Свободные окна</h1><p id="who">Отметьте дни — получите сторис</p></div>
    <button class="ic-btn" type="button" id="openSet" aria-label="Настройки: имя и цвета"><svg class="i"><use href="#i-gear"/></svg></button>
  </header>

  <section class="card">
    <div class="month-sw">
      <button class="ic-btn" type="button" id="mPrev" aria-label="Предыдущий месяц"><svg class="i"><use href="#i-left"/></svg></button>
      <b id="mName"></b>
      <button class="ic-btn" type="button" id="mNext" aria-label="Следующий месяц"><svg class="i"><use href="#i-right"/></svg></button>
    </div>
    <div class="cal" id="cal"></div>
    <div class="count-row"><span class="count" id="count"></span><button class="link-btn" type="button" id="allBtn"></button></div>
    <button class="btn-main" type="button" id="shareStory"><svg class="i" id="shareIc"><use href="#i-share"/></svg><span id="shareLbl">Отправить в сторис</span></button>
    <p class="hint" id="shareHint">Instagram, Telegram или «Сохранить изображение»</p>

  <section class="card prev-card">

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="setH" inert>
  <div class="grab"></div>
  <div class="sheet-h"><h2 id="setH">Настройки</h2><button class="done-btn" type="button" id="closeSet">Готово</button></div>
  <p class="lead">Имя и ник будут внизу картинки. Всё хранится только на этом телефоне.</p>
  <label class="field"><span>Имя</span><input id="sName" type="text" maxlength="40" placeholder="Например, Анна" autocomplete="name" autocapitalize="words" enterkeyhint="next"></label>
  <label class="field"><span>Где вам писать</span><input id="sContact" type="text" maxlength="40" placeholder="@ник или телефон" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next"></label>
  <label class="field"><span>Подпись на картинке</span><input id="capt" type="text" maxlength="60" placeholder="Пишите в личку — подберём время" enterkeyhint="done"></label>
  <div class="sub-h">Цвета</div>

  <div class="pick">
    <label>Фон <input type="color" id="cBg"></label>
    <label>Акцент <input type="color" id="cAc"></label>
  </div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
  const WD = ["пн","вт","ср","чт","пт","сб","вс"];
  const THEMES = [
    { n: "Уголь", bg: "#0B0B0A", ac: "#F37021" },
    { n: "Ночь", bg: "#0B1020", ac: "#6EA8FF" },
    { n: "Лес", bg: "#0C1510", ac: "#4CC77F" },
    { n: "Вино", bg: "#1A0B10", ac: "#E8475F" },
    { n: "Слива", bg: "#130E1C", ac: "#A585F0" },
    { n: "Бумага", bg: "#F3EFE7", ac: "#E0531A" },
    { n: "Песок", bg: "#E8DCC6", ac: "#2A2622" },
    { n: "Пудра", bg: "#F6E4E4", ac: "#C2405A" },
  ];
  const pad = n => String(n).padStart(2, "0");
  const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return `${n} ${m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c}`; };

  // ---------- хранилище: только этот телефон ----------
  const KEY = "svobodnye-okna-v1";
  let S = { name: "", contact: "", caption: "", bg: THEMES[0].bg, ac: THEMES[0].ac, free: {} };
  try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  delete S.role;  // поле с родом занятий убрано 05.11
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  // ---------- цвета ----------
  const hex2rgb = h => { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(x => x + x).join(""); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const rgb2hex = a => "#" + a.map(v => pad(Math.round(Math.max(0, Math.min(255, v))).toString(16))).join("");
  const mix = (a, b, t) => { const x = hex2rgb(a), y = hex2rgb(b); return rgb2hex(x.map((v, i) => v + (y[i] - v) * t)); };
  const rgba = (h, a) => `rgba(${hex2rgb(h).join(",")},${a})`;
  const lum = h => { const [r, g, b] = hex2rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; };
  let P = {};  // палитра для страницы и картинки
  function palette() {
    const bg = S.bg, ac = S.ac, light = lum(bg) > .35;
    const ink = light ? "#171614" : "#EEEDE9";
    const onAc = (lum(ac) + .05) / .05 > 1.05 / (lum(ac) + .05) ? "#121211" : "#FFFFFF";
    // акцентный цвет текста должен читаться на фоне: на тёмном — светлее, на светлом — темнее
    let acTxt = ac; for (let i = 0; i < 6; i++) { const L1 = lum(acTxt), L2 = lum(bg), cr = (Math.max(L1, L2) + .05) / (Math.min(L1, L2) + .05); if (cr >= 4.5) break; acTxt = mix(acTxt, light ? "#000000" : "#FFFFFF", .22); }
    P = { bg, ac, ink, onAc, light, acTxt, acTop: mix(ac, "#FFFFFF", .22),
      ink2: mix(bg, ink, .8), muted: mix(bg, ink, .6), faint: mix(bg, ink, .3), past: mix(bg, ink, .2), sheet: light ? mix(bg, "#FFFFFF", .55) : mix(bg, "#FFFFFF", .06) };
    const r = document.documentElement.style;
    r.setProperty("--bg", bg); r.setProperty("--ink", ink); r.setProperty("--ac", ac); r.setProperty("--on-ac", onAc); r.setProperty("--ac-txt", acTxt);
    r.setProperty("--ink-2", rgba(ink, .78)); r.setProperty("--muted", rgba(ink, light ? .66 : .62)); r.setProperty("--faint", rgba(ink, .38));
    r.setProperty("--card", rgba(ink, light ? .05 : .045)); r.setProperty("--tile", rgba(ink, light ? .07 : .07)); r.setProperty("--tile-hi", rgba(ink, .12)); r.setProperty("--line", rgba(ink, .10));
    r.setProperty("--ac-grad", `linear-gradient(180deg, ${P.acTop}, ${ac})`); r.setProperty("--sheet", P.sheet);
    document.querySelector('meta[name="theme-color"]').content = bg;
    $("cBg").value = bg; $("cAc").value = ac;
    $("themes").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.bg === bg && b.dataset.ac === ac));
    makeIcon();
  }
  function makeIcon() {
    const c = document.createElement("canvas"); c.width = c.height = 180; const x = c.getContext("2d");
    x.fillStyle = P.bg; x.fillRect(0, 0, 180, 180);
    const cells = [[0,0,0],[1,0,1],[2,0,0],[0,1,1],[1,1,0],[2,1,1],[0,2,0],[1,2,1],[2,2,0]];
    cells.forEach(([i, j, on]) => { x.fillStyle = on ? P.ac : rgba(P.ink, .14); x.beginPath(); x.arc(45 + i * 45, 45 + j * 45, 17, 0, Math.PI * 2); x.fill(); });
    $("favIcon").href = c.toDataURL("image/png");  // значок вкладки — в цветах мастера; иконка экрана «Домой» — постоянная, icon-180.png
  }
  $("themes").innerHTML = THEMES.map(t => `<button type="button" data-bg="${t.bg}" data-ac="${t.ac}" style="background:${t.bg}" aria-label="${t.n}"><span style="background:${t.ac}"></span><small style="color:${lum(t.bg) > .35 ? "#171614" : "#EEEDE9"}">${t.n}</small></button>`).join("");
  $("themes").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.bg = b.dataset.bg; S.ac = b.dataset.ac; save(); palette(); drawStory(); });
  $("cBg").addEventListener("input", e => { S.bg = e.target.value.toUpperCase(); save(); palette(); drawStory(); });
  $("cAc").addEventListener("input", e => { S.ac = e.target.value.toUpperCase(); save(); palette(); drawStory(); });

  // ---------- месяц ----------
  const now = new Date(), todayD = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let mOff = 0;
  const curMonth = () => new Date(todayD.getFullYear(), todayD.getMonth() + mOff, 1);
  const mKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  // старые месяцы не копим
  Object.keys(S.free).forEach(k => { if (k < mKey(todayD)) delete S.free[k]; });
  // в прошедших днях отметок не бывает: показываем только сегодня и дальше
  const freeIn = m => { const set = new Set(S.free[mKey(m)] || []); for (const d of [...set]) if (new Date(m.getFullYear(), m.getMonth(), d) < todayD) set.delete(d); return set; };
  // месяц почти кончился — сразу на следующий
  { const left = new Date(todayD.getFullYear(), todayD.getMonth() + 1, 0).getDate() - todayD.getDate(); if (left < 3 && !freeIn(curMonth()).size) mOff = 1; }

  function renderCal(dir) {
    const m = curMonth(), sel = freeIn(m), days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate(), lead = (m.getDay() + 6) % 7;
    $("mName").textContent = `${MONTHS[m.getMonth()]} ${m.getFullYear()}`;
    $("mPrev").disabled = mOff <= 0; $("mNext").disabled = mOff >= 2;
    let html = WD.map(d => `<span class="wd">${d}</span>`).join("") + "<span></span>".repeat(lead);
    for (let d = 1; d <= days; d++) {
      const dt = new Date(m.getFullYear(), m.getMonth(), d), past = dt < todayD, isT = dt.getTime() === todayD.getTime(), on = sel.has(d);
      html += `<button type="button" data-day="${d}" class="${on ? "free" : ""}${isT ? " today" : ""}"${past ? " disabled" : ""} aria-pressed="${on}" aria-label="${d}${isT ? ", сегодня" : ""}">${d}</button>`;
    }
    const cal = $("cal"); cal.innerHTML = html;
    if (dir) { cal.classList.remove("slide-l", "slide-r"); void cal.offsetWidth; cal.classList.add(dir > 0 ? "slide-l" : "slide-r"); }
    renderCount(); drawStory();
  }
  function renderCount() {
    const n = freeIn(curMonth()).size;
    $("count").textContent = n ? `свободно — ${plural(n, "день", "дня", "дней")}` : "Коснитесь свободных дней";
    $("count").classList.toggle("empty", !n);
    $("allBtn").textContent = n ? "Снять все" : "Отметить все";
    $("shareStory").disabled = !n;
  }
  const putMonth = (key, set) => { if (set.size) S.free[key] = [...set].sort((a, b) => a - b); else delete S.free[key]; save(); };
  // «Отметить все» — когда свободно почти всё и проще снять занятые; «Снять все» — с возвратом
  $("allBtn").addEventListener("click", () => {
    const m = curMonth(), key = mKey(m), was = freeIn(m);
    if (was.size) {
      putMonth(key, new Set()); renderCal();
      toast("Отметки сняты", "Вернуть", () => { putMonth(key, was); renderCal(); });
    } else {
      const all = new Set(), days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
      for (let d = 1; d <= days; d++) if (new Date(m.getFullYear(), m.getMonth(), d) >= todayD) all.add(d);
      putMonth(key, all); renderCal();
      toast("Теперь снимите занятые дни");
    }
  });
  const go = d => { const n = Math.max(0, Math.min(2, mOff + d)); if (n !== mOff) { mOff = n; renderCal(d); } };
  $("mPrev").addEventListener("click", () => go(-1));
  $("mNext").addEventListener("click", () => go(1));
  // листать месяц пальцем
  let sx = 0, sy = 0, swiped = false;
  $("cal").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiped = false; }, { passive: true });
  $("cal").addEventListener("touchend", e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { swiped = true; go(dx < 0 ? 1 : -1); } }, { passive: true });
  $("cal").addEventListener("click", e => {
    const b = e.target.closest("[data-day]"); if (!b || b.disabled || swiped) return;
    const m = curMonth(), key = mKey(m), d = +b.dataset.day, set = freeIn(m);
    if (set.has(d)) set.delete(d); else set.add(d);
    putMonth(key, set);
    b.classList.toggle("free", set.has(d)); b.setAttribute("aria-pressed", set.has(d));
    renderCount(); drawStory();
  });
  $("capt").value = S.caption;
  let captT; $("capt").addEventListener("input", () => { S.caption = $("capt").value; save(); clearTimeout(captT); captT = setTimeout(drawStory, 250); });
  $("capt").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });

  // ---------- картинка 1080 × 1920 ----------
  const canvas = document.createElement("canvas"); canvas.width = 1080; canvas.height = 1920;
  let lastBlob = null, drawT, gen = 0, blobGen = -1;
  const fontsReady = Promise.all([document.fonts.load('600 120px "Inter Tight"'), document.fonts.load('400 40px "Inter Tight"'), document.fonts.load('400 40px "Literata"')]).catch(() => {});
  // gen — номер последнего изменения; картинка в памяти годится, только если нарисована после него
  function drawStory() {
    const g = ++gen; clearTimeout(drawT);
    drawT = setTimeout(async () => {
      await fontsReady; if (g !== gen) return;
      paintStory();
      canvas.toBlob(b => { if (!b || g !== gen) return; lastBlob = b; blobGen = g; const u = URL.createObjectURL(b), img = $("storyImg"); if (img.dataset.u) URL.revokeObjectURL(img.dataset.u); img.dataset.u = u; img.src = u; }, "image/png");
    }, 60);
  }
  // при отправке: если только что коснулись дня и картинка ещё не перерисована — рисуем сразу, без ожидания
  function freshBlob() {
    if (blobGen === gen && lastBlob) return lastBlob;
    paintStory();
    const d = atob(canvas.toDataURL("image/png").split(",")[1]), a = new Uint8Array(d.length);
    for (let i = 0; i < d.length; i++) a[i] = d.charCodeAt(i);
    lastBlob = new Blob([a], { type: "image/png" }); blobGen = gen; return lastBlob;
  }
  function wrapLines(c, text, maxW) {
    const words = text.split(/\s+/), out = []; let line = "";
    for (const w of words) { const t = line ? line + " " + w : w; if (c.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
    if (line) out.push(line); return out;
  }
  function paintStory() {
    const c = canvas.getContext("2d"), W = 1080, H = 1920, m = curMonth(), sel = freeIn(m);
    const F = (w, s) => `${w} ${s}px "Inter Tight", "Helvetica Neue", Arial, sans-serif`;
    const SER = s => `400 ${s}px "Literata", Georgia, serif`;
    c.fillStyle = P.bg; c.fillRect(0, 0, W, H);
    let g = c.createRadialGradient(W * .92, H * .02, 0, W * .92, H * .02, W * .95);
    g.addColorStop(0, rgba(P.ac, P.light ? .22 : .38)); g.addColorStop(1, rgba(P.ac, 0)); c.fillStyle = g; c.fillRect(0, 0, W, H);
    g = c.createRadialGradient(W * .05, H * .98, 0, W * .05, H * .98, W * .7);
    g.addColorStop(0, rgba(P.ac, P.light ? .10 : .16)); g.addColorStop(1, rgba(P.ac, 0)); c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.textBaseline = "alphabetic"; c.textAlign = "left";
    c.fillStyle = P.acTxt; c.font = F(500, 38); c.fillText("ЗАПИСЬ ОТКРЫТА", 90, 210);
    c.fillStyle = P.ink; c.font = F(600, 128); c.fillText("Свободные", 82, 350); c.fillText("окна", 82, 480);
    const mt = `${MONTHS[m.getMonth()]} ${m.getFullYear()}`;
    c.fillStyle = P.acTxt; c.font = F(600, 72); c.fillText(mt[0].toUpperCase() + mt.slice(1), 86, 600);

    // низ: имя слева, ник справа на той же строке; не влезают рядом — ник строкой ниже
    const name = S.name.trim(), contact = S.contact.trim(), hasFoot = !!(name || contact);
    c.font = F(600, 44); const ctW = contact ? c.measureText(contact).width : 0;
    c.font = F(600, 50); const nameS = name ? Math.min(50, Math.floor(50 * 900 / Math.max(c.measureText(name).width, 1))) : 50, nameW = name ? c.measureText(name).width * nameS / 50 : 0;
    const side = !name || !contact || nameW + ctW + 48 <= 900;
    const footY = !hasFoot ? H - 60 : side ? H - 150 : H - 210;
    const cap = ($("capt").value || "Пишите в личку — подберём время").trim();
    c.font = SER(44); const capLines = wrapLines(c, cap, 900);
    const lead = (m.getDay() + 6) % 7, days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate(), rowsN = Math.ceil((lead + days) / 7);
    const x0 = 90, cw = 900 / 7, y0 = 720;
    const ch = Math.min(122, Math.floor((footY - 90 - 50 - 14 - (capLines.length - 1) * 60 - 110 - 20 - 70 - y0) / rowsN)), rad = Math.min(50, Math.round(ch * .42));
    c.textAlign = "center"; c.font = F(500, 34); c.fillStyle = mix(P.bg, P.ink, .42);
    WD.forEach((d, i) => c.fillText(d, x0 + cw * i + cw / 2, y0));
    for (let d = 1; d <= days; d++) {
      const idx = lead + d - 1, col = idx % 7, row = Math.floor(idx / 7), cx = x0 + cw * col + cw / 2, cy = y0 + 70 + row * ch;
      const past = new Date(m.getFullYear(), m.getMonth(), d) < todayD;
      if (sel.has(d)) {
        const bg = c.createLinearGradient(0, cy - rad, 0, cy + rad); bg.addColorStop(0, P.acTop); bg.addColorStop(1, P.ac);
        c.save(); c.shadowColor = rgba(P.ac, P.light ? .35 : .55); c.shadowBlur = 36; c.fillStyle = bg;
        c.beginPath(); c.arc(cx, cy, rad, 0, Math.PI * 2); c.fill(); c.restore();
        c.fillStyle = P.onAc; c.font = F(700, 44);
      } else { c.fillStyle = past ? P.past : P.muted; c.font = F(500, 42); }
      c.fillText(String(d), cx, cy + 15);
    }
    c.textAlign = "left";
    const yl = y0 + 70 + rowsN * ch + 20;
    c.fillStyle = P.ac; c.beginPath(); c.arc(104, yl - 12, 14, 0, Math.PI * 2); c.fill();
    c.fillStyle = P.ink2; c.font = F(500, 36); c.fillText(sel.size ? `свободно — ${plural(sel.size, "день", "дня", "дней")}` : "отметьте свободные дни", 134, yl);
    c.fillStyle = P.ink; c.font = SER(44);
    capLines.forEach((l, i) => c.fillText(l, 90, yl + 110 + i * 60));
    if (hasFoot) {
      c.fillStyle = rgba(P.ink, .10); c.fillRect(90, footY - 90, 900, 2);
      if (name) { c.fillStyle = P.ink; c.font = F(600, nameS); c.fillText(name, 90, footY); }
      if (contact) {
        c.fillStyle = P.acTxt; c.font = F(600, 44);
        if (!name) c.fillText(contact, 90, footY);
        else if (side) { c.textAlign = "right"; c.fillText(contact, 990, footY); c.textAlign = "left"; }
        else c.fillText(contact, 90, footY + 66);
      }
    }
  }
  const fileName = () => `svobodnye-okna-${mKey(curMonth())}.png`;
  const download = blob => {
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName();
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast("Картинка скачана");
  };
  // одна кнопка: на телефоне — меню «Поделиться» (там и Instagram, и «Сохранить изображение»), на компьютере без него — скачать
  let canShareFiles = false;
  try { canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [new File(["x"], "a.png", { type: "image/png" })] })); } catch (e) {}
  if (!canShareFiles) { $("shareLbl").textContent = "Скачать картинку"; $("shareIc").innerHTML = '<use href="#i-down"/>'; $("shareHint").hidden = true; }
  $("shareStory").addEventListener("click", async () => {
    if (!freeIn(curMonth()).size) return;
    const blob = freshBlob();
    if (!canShareFiles) return download(blob);
    const file = new File([blob], fileName(), { type: "image/png" });
    try { await navigator.share({ files: [file] }); } catch (e) { if (e.name !== "AbortError") download(blob); }
  });

  // ---------- настройки ----------
  const sheet = $("sheet"), scrim = $("scrim");
  function renderWho() { const t = [S.name.trim(), S.contact.trim()].filter(Boolean).join(" · "); $("who").textContent = t || "Отметьте дни — получите сторис"; }
  function openSet(first) {
    $("setH").textContent = first === true ? "Как вас подписать?" : "Настройки";
    $("sName").value = S.name; $("sContact").value = S.contact; $("capt").value = S.caption;
    sheet.scrollTop = 0; sheet.inert = false; sheet.classList.add("on"); scrim.classList.add("on");
  }
  function closeSet() { sheet.classList.remove("on"); scrim.classList.remove("on"); sheet.inert = true; document.activeElement?.blur(); renderWho(); drawStory(); }
  [["sName", "name"], ["sContact", "contact"]].forEach(([id, k]) => $(id).addEventListener("input", e => { S[k] = e.target.value; save(); drawStory(); }));
  // «Далее» на клавиатуре — к следующему полю, «Готово» на последнем — убрать клавиатуру
  $("sName").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("sContact").focus(); } });
  $("sContact").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("capt").focus(); } });
  $("openSet").addEventListener("click", openSet);
  $("closeSet").addEventListener("click", closeSet);
  scrim.addEventListener("click", closeSet);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet.classList.contains("on")) closeSet(); });
  // шторку можно смахнуть вниз, как в айфоне
  let dy0 = null, dy = 0;
  sheet.addEventListener("touchstart", e => { dy0 = sheet.scrollTop <= 0 && !e.target.closest("input") ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  sheet.addEventListener("touchmove", e => { if (dy0 === null) return; dy = Math.max(0, e.touches[0].clientY - dy0); if (dy > 4) { sheet.classList.add("drag"); sheet.style.transform = `translateY(${dy}px)`; } }, { passive: true });
  sheet.addEventListener("touchend", () => { if (dy0 === null) return; sheet.classList.remove("drag"); sheet.style.transform = ""; if (dy > 90) closeSet(); dy0 = null; });

  let toastT;
  function toast(t, act, fn) {
    const el = $("toast"); el.textContent = t;
    if (act) { const b = document.createElement("button"); b.type = "button"; b.textContent = act; b.onclick = () => { fn(); el.classList.remove("on"); }; el.append(b); }
    el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), act ? 4500 : 2200);
  }

  palette(); renderWho(); renderCal(); save();
  if (!S.name.trim() && !S.contact.trim()) setTimeout(() => openSet(true), 350);  // первый вход — сразу спросить имя
})();
</script>
